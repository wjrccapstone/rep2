services:
  - type: web
    name: wjrc-sarima-api
    runtime: python
    buildCommand: pip install -r scripts/python/requirements.txt
    startCommand: uvicorn scripts.python.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FORECAST_API_TOKEN
        sync: false